fonte:
  trimestral: https://sidra.ibge.gov.br/pesquisa/pnadct/tabelas
  mensal: https://sidra.ibge.gov.br/pesquisa/pnadcm
  api_descritor: https://apisidra.ibge.gov.br/DescritoresTabela/t/{T}
  api_valores: https://apisidra.ibge.gov.br/values/t/{T}/n{N}/all/p/{P}/v/{V}/c{Ci}/{cats}/f/u

blocos_tematicos:
  - diaristas
  - informalidade
  - rendimento
  - horas
  - mercado_geral
  - recortes_equidade
  - outros

categorias_ped:
  PIA: Pessoas com 14 anos ou mais (População em Idade Ativa)
  PEA: Ocupados + desocupados (na força de trabalho)
  Ocupado: Pessoas ocupadas na semana de referência
  Desocupado: Pessoas desocupadas na semana de referência (desemprego aberto)
  Inativo: Fora da força de trabalho
  Subutilizacao: Subutilizada / desalentada (proxy de desemprego oculto da PED)
  Rendimento: Rendimento médio mensal real
  Horas: Horas habituais/efetivamente trabalhadas
  Informalidade: Situação de informalidade no trabalho principal

